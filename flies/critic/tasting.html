<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mouche: Gordo Inglewood's tasting room</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink:#2b1d14; --paper:#fbf6ec; --line:#e4d8c3; --accent:#a8321e; --muted:#8a7764; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background: var(--paper); color: var(--ink); }
  header { padding: 14px 24px 10px; border-bottom: 1px solid var(--line); display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  h1 { margin:0; font-size: 26px; letter-spacing: .5px; }
  h1 small { font-size: 15px; color: var(--muted); font-style: italic; font-weight: normal; }
  #brainlabel { font: 13px ui-monospace, Menlo, monospace; color: var(--muted); }
  #brainlabel.untrained { color: var(--accent); }
  label.lesion { margin-left:auto; font: 13px ui-monospace, Menlo, monospace; cursor:pointer; user-select:none; }
  label.lesion abbr { cursor: help; }
  main { display:grid; grid-template-columns: minmax(300px, 0.9fr) minmax(380px, 1.1fr) 400px; min-height: calc(100vh - 58px); }
  #menu { padding: 10px 20px 40px; border-right: 1px solid var(--line); overflow:auto; max-height: calc(100vh - 58px); }
  #menu h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin: 16px 0 8px; font-weight: normal; border-bottom: 1px dotted var(--line); padding-bottom: 4px; }
  .dishes { display:grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 7px; }
  .dish { background:#fff; border:1px solid var(--line); border-radius: 10px; padding: 8px 4px 6px; text-align:center; cursor:pointer;
          transition: transform .12s, box-shadow .12s, border-color .12s; font-size: 12px; position: relative; }
  .dish:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(60,30,10,.12); border-color: #c9b597; }
  .dish:active { transform: scale(.97); }
  .dish .e { font-size: 30px; display:block; line-height: 1.2; }
  .dish.rotten .e { filter: sepia(.8) hue-rotate(40deg) saturate(.6) brightness(.8); }
  .dish.rotten::after { content: "🦠"; position:absolute; top:4px; right:6px; font-size: 12px; }
  .dish .last { display:block; font: 10px ui-monospace, Menlo, monospace; color: var(--muted); min-height: 13px; margin-top: 2px; }

  /* the brain */
  #brainpanel { position:relative; background: radial-gradient(ellipse at 50% 45%, #0d1a14 0%, #050807 70%); color:#cfe; overflow:hidden; }
  #brainpanel canvas { display:block; width:100%; height:100%; }
  #phase { position:absolute; top:14px; left:16px; right:16px; font: 13px ui-monospace, Menlo, monospace; color:#8fd; text-shadow: 0 0 8px #0f8; }
  #phase b { color:#fff; }
  #steps { display:flex; gap:4px; margin-top:8px; }
  #steps i { width: 22px; height: 6px; border-radius: 3px; background: #1d2b25; transition: background .1s; }
  #steps i.on { background: #6fe; box-shadow: 0 0 6px #6fe; }
  #steps i.read { outline: 1px solid #6fe5; }
  #legend { position:absolute; bottom:12px; left:16px; font: 11px ui-monospace, Menlo, monospace; line-height:1.55; color:#9bb; }
  #legend .g { transition: color .15s, text-shadow .15s; }
  #tip { position:absolute; display:none; pointer-events:none; background:#000c; border:1px solid #3a6; color:#cfe; padding:4px 7px; font: 11px ui-monospace, Menlo, monospace; border-radius:4px; }
  #explain { position:absolute; bottom:12px; right:16px; width: 210px; font: 11px/1.45 ui-monospace, Menlo, monospace; color:#7a9; text-align:right; }

  /* the table */
  #table { padding: 16px 22px; display:flex; flex-direction:column; gap: 12px; background: linear-gradient(#fbf6ec, #f4ecdc); overflow:auto; max-height: calc(100vh - 58px); }
  #stage { position:relative; height: 120px; display:flex; align-items:flex-end; justify-content:center; }
  #plate { width: 150px; height: 40px; border-radius: 50%; background: radial-gradient(#fff 55%, #e9e2d4 70%, #fff 72%);
           box-shadow: 0 6px 14px rgba(0,0,0,.12); position:relative; display:flex; justify-content:center; }
  #served { position:absolute; bottom: 12px; font-size: 54px; transition: transform .35s cubic-bezier(.3,1.6,.6,1), opacity .3s; }
  #served.rotten { filter: sepia(.8) hue-rotate(40deg) saturate(.6) brightness(.8); }
  #fly { position:absolute; bottom: 44px; left: calc(50% - 130px); font-size: 40px; transition: left .35s ease, transform .35s ease; }
  #fly.tasting { left: calc(50% - 56px); transform: rotate(18deg); }
  #fly.happy { animation: hop .35s ease 3; }
  #fly.disgust { animation: shake .08s linear 6; }
  @keyframes hop { 50% { transform: translateY(-16px) rotate(-10deg); } }
  @keyframes shake { 50% { transform: translateX(-6px) rotate(-14deg); } }
  #score { text-align:center; }
  #score .num { font: 600 42px ui-monospace, Menlo, monospace; letter-spacing: -1px; }
  #score .num small { font-size: 18px; color: var(--muted); font-weight: normal; }
  #score .verdict { font-style: italic; font-size: 20px; margin-top: 2px; min-height: 26px; }
  #score .dishname { font-size: 15px; color: var(--muted); min-height: 20px; }
  #scale { position:relative; margin: 2px 0 18px; }
  #scale .bands { display:flex; height: 16px; border-radius: 4px; overflow:hidden; }
  #scale .bands span { height:100%; opacity:.35; transition: opacity .2s; }
  #scale .bands span.on { opacity: 1; }
  #scale .ticks { position:relative; height: 14px; font: 9px ui-monospace, Menlo, monospace; color: var(--muted); }
  #scale .ticks span { position:absolute; transform: translateX(-50%); top: 2px; }
  #marker { position:absolute; top:-5px; width: 2px; height: 26px; background: var(--ink); left: 0; transition: left .9s cubic-bezier(.2,.8,.2,1); opacity:0; }
  #marker::after { content:"▼"; position:absolute; top:-11px; left:-5px; font-size: 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h3 { margin:0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: normal; }
  .bar { display:grid; grid-template-columns: 150px 1fr 46px; align-items:center; gap: 8px; font: 11px ui-monospace, Menlo, monospace; margin: 3px 0; }
  .bar .track { height: 9px; background:#f1ebe0; border-radius: 5px; overflow:hidden; }
  .bar .fill { display:block; height:100%; width:0; border-radius: 5px; transition: width .4s ease; }
  .bar.pick span:first-child { font-weight: bold; }
  .bar .rng { color: var(--muted); }
  #meta { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); line-height: 1.5; }
  #history { font: 11px ui-monospace, Menlo, monospace; max-height: 140px; overflow:auto; }
  #history div { display:flex; justify-content:space-between; padding: 2px 0; border-bottom: 1px dotted var(--line); }
  .hint { color: var(--muted); font-style: italic; text-align:center; }
  @media (max-width: 1150px) { main { grid-template-columns: 1fr 1fr; } #brainpanel { grid-column: 1 / -1; grid-row: 1; height: 420px; } }
</style>
</head>
<body>
<header>
  <h1>Le Mouche <small>Gordo Inglewood's tasting room</small></h1>
  <span id="brainlabel">connecting to the brain…</span>
  <label class="lesion"><input type="checkbox" id="lesion">
    <abbr title="Cuts every connection between neurons (all synapse strengths set to zero). The taste still reaches the sensory neurons, but nothing can travel through the brain, so every dish gets the same score. It proves the rating really comes from the connectome.">lesion the brain</abbr></label>
</header>
<main>
  <section id="menu"></section>
  <section id="brainpanel">
    <div id="phase">click a dish to watch the fly's brain taste it<div id="steps"></div></div>
    <div id="legend"></div>
    <div id="explain"></div>
    <div id="tip"></div>
  </section>
  <section id="table">
    <div id="stage"><span id="fly">🪰</span><div id="plate"><span id="served"></span></div></div>
    <div id="score">
      <div class="dishname" id="dishname">&nbsp;</div>
      <div class="num" id="num">–.––––––– <small>/ 10</small></div>
      <div class="verdict" id="verdict"><span class="hint">click a dish on the menu to serve it</span></div>
    </div>
    <div id="scale"><div class="bands" id="bands"></div><div id="marker"></div><div class="ticks" id="ticks"></div></div>
    <div class="card">
      <h3>Verdict neurons: probability of each verdict</h3>
      <div id="bars"></div>
    </div>
    <div class="card"><h3>Tasting notes</h3><div id="history"></div></div>
    <div id="meta"></div>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const SECTIONS = { fruit: "Fruit", vegetable: "Vegetables", meat: "Meat", rotten: "Rotten", poop: "Poop" };
const SAY = { spit_it_out: "*spits it out*", revolting: "“Revolting.”", bad: "“Bad.”", meh: "“Meh.”",
  decent: "“Decent.”", good: "“Good!”", delicious: "“Delicious!”", chefs_kiss: "“Chef's kiss.” 🤌" };
const STEP_MS = 170;
let info, busy = false;
const $ = (id) => document.getElementById(id);
const hueOf = (v) => Math.round(v * 12);                 // 0 red -> 10 green
const css = (v) => `hsl(${hueOf(v)}, 70%, 45%)`;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------------------------------------------------------------- the brain view
const brain = {
  async init(preset) {
    const panel = $("brainpanel");
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    panel.prepend(this.renderer.domElement);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);
    this.camera.position.set(0, 0.25, 2.5);
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.autoRotate = true; this.controls.autoRotateSpeed = 0.5; this.controls.enableDamping = true;
    this.ray = new THREE.Raycaster(); this.ray.params.Points.threshold = 0.012;
    const [buf, meta] = await Promise.all([
      fetch(`/data/${preset}.points.bin`).then((r) => r.arrayBuffer()),
      fetch(`/data/${preset}.meta.json`).then((r) => r.json())]);
    this.meta = meta;
    const pos = new Float32Array(buf), n = meta.n;
    this.n = n;
    this.base = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const dim = meta.classes[meta.class_index[i]] === "optic" ? 0.035 : 0.07;
      this.base.set([0, dim, dim * 0.5], i * 3);
    }
    for (const i of info.input_idx) this.base.set([0.05, 0.22, 0.3], i * 3);   // taste goes in here
    this.colors = new Float32Array(this.base);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(this.colors, 3));
    this.points = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.011, vertexColors: true, transparent: true,
      opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.scene.add(this.points);
    // the 8 verdict groups of descending neurons: big dots, coloured red (0) -> green (10)
    this.groups = info.groups.map((idx, k) => {
      const gp = new Float32Array(idx.length * 3);
      idx.forEach((j, m) => gp.set(pos.subarray(j * 3, j * 3 + 3), m * 3));
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(gp, 3));
      const color = new THREE.Color(`hsl(${hueOf(info.values[k])}, 90%, 55%)`);
      const p = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.04, color, transparent: true, opacity: 0.3,
        blending: THREE.AdditiveBlending, depthWrite: false }));
      this.scene.add(p);
      return p;
    });
    $("legend").innerHTML = info.actions.map((a, k) =>
      `<div class="g" id="lg-${k}"><span style="color:hsl(${hueOf(info.values[k])},90%,55%)">●</span> ${a} neurons (16)</div>`).join("")
      + `<div><span style="color:#4cf">●</span> taste-input (sensory) neurons</div>`;
    $("steps").innerHTML = Array.from({ length: 8 }, (_, s) => `<i class="${s >= 4 ? "read" : ""}"></i>`).join("");
    $("explain").innerHTML = `${n.toLocaleString()} real FlyWire neurons.<br>Each taste runs 8 brain steps; the verdict
      is read from steps 5–8 <span style="color:#6fe">(outlined)</span>.<br>Drag to rotate · hover a neuron`;
    addEventListener("resize", () => this.resize());
    this.renderer.domElement.addEventListener("mousemove", (e) => this.hover(e));
    this.resize();
    this.renderer.setAnimationLoop(() => { this.controls.update(); this.renderer.render(this.scene, this.camera); });
  },
  resize() {
    const el = $("brainpanel"), w = el.clientWidth, h = el.clientHeight || 400;
    this.renderer.setSize(w, h); this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
  },
  hover(e) {
    const r = this.renderer.domElement.getBoundingClientRect();
    const p = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(p, this.camera);
    const hit = this.ray.intersectObject(this.points)[0], tip = $("tip");
    if (!hit) { tip.style.display = "none"; return; }
    const i = hit.index, m = this.meta;
    const k = info.groups.findIndex((g) => g.includes(i));
    tip.style.display = "block";
    tip.style.left = e.clientX - r.left + 12 + "px"; tip.style.top = e.clientY - r.top + 12 + "px";
    tip.textContent = `${m.cell_type[i] || "unnamed"} · ${m.classes[m.class_index[i]]}` +
      (k >= 0 ? ` · votes "${info.actions[k]}"` : info.input_idx.includes(i) ? " · taste input" : "") + ` · FlyWire ${m.root_id[i]}`;
  },
  // replay one taste: every neuron's firing, step by step
  async play(act) {
    const raw = Uint8Array.from(atob(act.data), (c) => c.charCodeAt(0));
    const { steps, n } = act, attr = this.points.geometry.getAttribute("color");
    const lights = [...$("steps").children];
    const phases = ["the taste hits the sensory neurons", "signal spreads through the central brain",
      "signal spreads through the central brain", "descending neurons start to vote",
      "reading the verdict neurons", "reading the verdict neurons", "reading the verdict neurons", "reading the verdict neurons"];
    for (let s = 0; s < steps; s++) {
      const off = s * n;
      for (let i = 0; i < n; i++) {
        const v = raw[off + i] / 255;
        this.colors[i * 3] = this.base[i * 3] + v * 0.9;
        this.colors[i * 3 + 1] = this.base[i * 3 + 1] + v * 1.3;
        this.colors[i * 3 + 2] = this.base[i * 3 + 2] + v * 0.5;
      }
      attr.needsUpdate = true;
      info.groups.forEach((idx, k) => {
        let sum = 0; for (const j of idx) sum += raw[off + j];
        const a = Math.min(1, (sum / idx.length / 255) * 2.5);
        this.groups[k].material.opacity = 0.15 + 0.85 * a;
        this.groups[k].material.size = 0.035 + 0.05 * a;
        const lg = $(`lg-${k}`); lg.style.color = a > 0.35 ? "#fff" : ""; lg.style.textShadow = a > 0.35 ? "0 0 6px #fff8" : "";
      });
      lights.forEach((l, j) => l.classList.toggle("on", j <= s));
      $("phase").firstChild.textContent = `brain step ${s + 1}/8: ${phases[s]}`;
      await wait(STEP_MS);
    }
  },
  async settle() {   // fade back to resting glow
    const attr = this.points.geometry.getAttribute("color"), start = new Float32Array(this.colors);
    for (let t = 0; t <= 1; t += 0.1) {
      for (let i = 0; i < this.colors.length; i++) this.colors[i] = start[i] + (this.base[i] - start[i]) * t;
      attr.needsUpdate = true;
      await wait(60);
    }
  },
};

// ---------------------------------------------------------------- the table
async function boot() {
  info = await (await fetch("/api/info")).json();
  const b = $("brainlabel");
  b.textContent = `${info.trained ? "trained" : "UNTRAINED"} ${info.preset} brain · ${info.neurons.toLocaleString()} real neurons`;
  b.classList.toggle("untrained", !info.trained);
  const menu = $("menu");
  for (const [g, title] of Object.entries(SECTIONS)) {
    const h = document.createElement("h2"); h.textContent = title; menu.appendChild(h);
    const grid = document.createElement("div"); grid.className = "dishes"; menu.appendChild(grid);
    for (const d of info.menu.filter((d) => d.group === g)) {
      const el = document.createElement("div");
      el.className = `dish ${g}`;
      el.innerHTML = `<span class="e">${d.emoji}</span>${d.name}<span class="last"></span>`;
      el.onclick = () => taste(d, el);
      grid.appendChild(el);
    }
  }
  // score bands: each verdict owns a fixed range of scores
  const edges = [0, ...info.bands, 10];
  const range = (k) => `${edges[k].toFixed(1)}–${edges[k + 1].toFixed(1)}`;
  $("bands").innerHTML = info.actions.map((a, k) =>
    `<span id="band-${k}" title="${a}: ${range(k)}" style="width:${(edges[k + 1] - edges[k]) * 10}%;background:${css(info.values[k])}"></span>`).join("");
  $("ticks").innerHTML = edges.map((e) => `<span style="left:${e * 10}%">${e.toFixed(1).replace(".0", "")}</span>`).join("");
  $("bars").innerHTML = info.actions.map((a, k) =>
    `<div class="bar" id="bar-${a}"><span>${a} <span class="rng">${range(k)}</span></span><span class="track"><span class="fill" style="background:${css(info.values[k])}"></span></span><span class="p">–</span></div>`).join("");
  const r = info.result;
  if (info.trained && r && r.teacher_agreement != null)
    $("meta").textContent = `training: agrees with the palate teacher ${(r.teacher_agreement * 100).toFixed(1)}% (chance ${(r.teacher_agreement_chance * 100).toFixed(1)}%)`;
  await brain.init(info.preset);
}

function countUp(el, to, ms) {
  const t0 = performance.now();
  return new Promise((done) => {
    (function frame(now) {
      const t = Math.min(1, (now - t0) / ms), v = to * (1 - Math.pow(1 - t, 3));
      el.innerHTML = `${v.toFixed(7)} <small>/ 10</small>`;
      el.style.color = css(v);
      t < 1 ? requestAnimationFrame(frame) : done();
    })(t0);
  });
}

async function taste(d, card) {
  if (busy) return;
  busy = true;
  const fly = $("fly"), served = $("served");
  fly.className = "";
  served.className = d.group === "rotten" ? "rotten" : "";
  served.textContent = d.emoji;
  served.style.transform = "translateY(-110px)"; served.style.opacity = 1;
  await wait(20);
  served.style.transform = "translateY(0)";
  $("dishname").textContent = d.name;
  $("num").innerHTML = `–.––––––– <small>/ 10</small>`; $("num").style.color = "";
  $("verdict").innerHTML = `<span class="hint">tasting…</span>`;
  $("marker").style.opacity = 0;
  document.querySelectorAll("#bands span").forEach((s) => s.classList.remove("on"));
  const res = fetch("/api/taste", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ food: d.name, lesion: $("lesion").checked }) }).then((r) => r.json());
  await wait(300);
  fly.className = "tasting";
  const r = await res;
  await brain.play(r.activity);
  fly.className = "";
  $("phase").firstChild.textContent = r.lesioned
    ? "lesioned: no connections, so the taste can't reach the verdict neurons"
    : `verdict neurons settled: ${r.verdict} (${r.rating_text})`;
  const k = info.actions.indexOf(r.verdict);
  $("marker").style.left = `${r.rating * 10}%`; $("marker").style.opacity = 1;
  $(`band-${k}`).classList.add("on");
  info.actions.forEach((a, i) => {
    const row = $(`bar-${a}`);
    row.querySelector(".fill").style.width = `${(r.probs[i] * 100).toFixed(1)}%`;
    row.querySelector(".p").textContent = `${(r.probs[i] * 100).toFixed(1)}%`;
    row.classList.toggle("pick", a === r.verdict);
  });
  await countUp($("num"), r.rating, 900);
  $("verdict").textContent = SAY[r.verdict] + (r.lesioned ? "  (lesioned: tastes nothing)" : "");
  fly.className = r.rating >= 6.43 ? "happy" : r.rating < 3.57 ? "disgust" : "";
  if (r.rating >= 7.86) served.style.transform = "scale(.4)", served.style.opacity = 0.2;
  if (r.rating < 0.71) served.style.transform = "translate(140px, -40px) rotate(90deg)", served.style.opacity = 0;
  card.querySelector(".last").textContent = r.rating.toFixed(7);
  const row = document.createElement("div");
  row.innerHTML = `<span>${d.emoji} ${d.name}${r.lesioned ? " ⚡" : ""}</span><span><span style="color:var(--muted)">${r.verdict}</span> <b style="color:${css(r.rating)}">${r.rating.toFixed(7)}</b></span>`;
  $("history").prepend(row);
  $("meta").textContent = `${r.preset} brain · mean firing ${r.mean_rate.toFixed(4)} · palate teacher's answer ${r.palate.toFixed(7)}`;
  brain.settle();
  busy = false;
}
boot().catch((e) => { $("brainlabel").textContent = "brain server offline: run python flies/critic/tasting.py"; console.error(e); });
</script>
</body>
</html>
