<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flyhack</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
} }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/latin-600.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
               font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #world { position: fixed; inset: 0; }
  #world canvas { display: block; transition: filter .25s ease; }
  #world canvas.dim { filter: saturate(.25) brightness(.55) !important; }

  /* film: grain and vignette over everything, so the fly and the photo read as one picture */
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%); }
  #grain { position: fixed; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
           animation: grain .5s steps(4) infinite; }
  @keyframes grain { 0% { transform: translate(0,0) } 25% { transform: translate(-3%,2%) }
                     50% { transform: translate(2%,-3%) } 75% { transform: translate(-2%,-1%) } }

  /* the switch: map and aerial images over the canvas, and the flash */
  #switch { position: fixed; inset: 0; overflow: hidden; opacity: 0; pointer-events: none; background: #000; }
  #switch img { position: absolute; left: 0; top: 0; opacity: 0; }
  #switch .map { transform-origin: 0 0; }
  #switch .aerial { width: 100%; height: 100%; object-fit: cover; }
  #switch::after { content: ""; position: absolute; inset: 0; background: #2b4a6b; mix-blend-mode: soft-light; opacity: .55; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #cover { position: fixed; inset: 0; background: #000; transition: opacity 1.2s ease; pointer-events: none; }
  #cover.gone { opacity: 0; }

  /* the fly's name, bottom right, on arrival */
  #name { position: fixed; right: 56px; bottom: 52px; text-align: right; opacity: 0; transform: translateY(6px);
          transition: opacity .5s ease, transform .5s ease; text-shadow: 0 1px 12px rgba(0,0,0,.6); pointer-events: none; }
  #name.on { opacity: 1; transform: none; }
  #name b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  #name i { display: block; font-style: normal; font-size: 13px; opacity: .7; margin-top: 4px; }

  /* its latest line, like a subtitle */
  #sub { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: 60vw; text-align: center;
         font-size: 17px; line-height: 1.4; opacity: 0; transition: opacity .4s ease; pointer-events: none;
         text-shadow: 0 1px 3px #000, 0 0 14px rgba(0,0,0,.6); }
  #sub.on { opacity: .92; }

  /* the wheel */
  #wheel { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .15s ease; }
  #wheel.open { opacity: 1; pointer-events: auto; }
  #wheel .ring { position: relative; width: 0; height: 0; }
  #wheel .slot { position: absolute; left: -60px; top: -60px; width: 120px; text-align: center; cursor: pointer; }
  #wheel .face { width: 104px; height: 104px; margin: 0 auto; border-radius: 50%; overflow: hidden; background: #1a1a1c;
                 box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 6px 24px rgba(0,0,0,.5); transition: transform .12s ease, box-shadow .12s ease; }
  #wheel .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #wheel .face img:not([src]) { visibility: hidden; }
  #wheel .name { margin-top: 10px; font-size: 13px; font-weight: 600; opacity: .75; text-shadow: 0 1px 6px #000; white-space: nowrap; }
  #wheel .slot.sel .face { transform: scale(1.14); box-shadow: 0 0 0 3px #fff, 0 8px 30px rgba(0,0,0,.6); }
  #wheel .slot.sel .name { opacity: 1; }

  /* dishes for flies that wait to be fed */
  #menu { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); display: none; gap: 6px;
          max-width: 80vw; overflow-x: auto; scrollbar-width: none; }
  #menu.on { display: flex; }
  #menu.waiting { opacity: .35; pointer-events: none; }
  #menu button { font-size: 24px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
                 background: rgba(0,0,0,.35); backdrop-filter: blur(6px); transition: transform .1s ease; }
  #menu button:hover { transform: scale(1.15); }

  #status { position: fixed; left: 24px; bottom: 20px; font-size: 12px; opacity: 0; transition: opacity .3s; }
  #status.on { opacity: .6; }
  #edit { position: fixed; left: 16px; top: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.55);
          padding: 8px 10px; border-radius: 6px; white-space: pre; }
  #edit::after { content: attr(data-msg); display: block; color: #9fe; }
</style>
</head>
<body>
<div id="world"></div>
<div id="vignette"></div>
<svg id="grain" width="200%" height="200%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="name"></div>
<div id="sub"></div>
<div id="menu"></div>
<div id="wheel"><div class="ring"></div></div>
<div id="switch"><img class="map" alt=""><img class="aerial" alt=""></div>
<div id="flash"></div>
<div id="cover"></div>
<div id="status">offline</div>
<div id="edit" hidden>shift+click  place fly
[ ]  turn      - =  size
c  fly frame   v  scene frame
k  collision mesh
p  copy scene.json</div>
<script type="module" src="./world.js"></script>
</body>
</html>
